plugins { id 'com.android.application' }

// número da versão vem do GitHub Actions (cada build ganha um número maior)
def buildNum = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.scoffyt.trilhadoedson'
    compileSdk 34
    defaultConfig {
        applicationId 'com.scoffyt.trilhadoedson'
        minSdk 24
        targetSdk 34
        versionCode buildNum
        versionName "1.${buildNum}"
    }
    // chave fixa (debug, pública) para o APK novo instalar por cima do antigo
    signingConfigs {
        fixa {
            storeFile file('trilha.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixa }
        release { signingConfig signingConfigs.fixa; minifyEnabled false }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
